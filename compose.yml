name: aixiu

services:
  db:
    image: mysql:8.4@sha256:0f51e63e537a1f176423fa03ef559aabe6fa4372a53160a44bc7e75da7d15364
    command: ["--default-time-zone=+00:00"]
    environment:
      MYSQL_DATABASE: auto_care_demo
      MYSQL_USER: autocare_app
      MYSQL_PASSWORD: ${DB_PASSWORD:?Run backend/deploy/New-DemoEnv.ps1 or provide DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Provide MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -N -e "SELECT 1"']
      interval: 3s
      timeout: 5s
      retries: 30

  vector:
    profiles: [ai]
    image: redis/redis-stack-server:7.4.0-v8@sha256:798ab84d9f266936b034ab11c4d04a2b8e4b441884c5aa7d17ac951eefdf742a
    environment:
      REDIS_ARGS: --appendonly yes
    volumes:
      - vector-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  app:
    image: aixiu:local
    build:
      context: backend
      dockerfile: deploy/Dockerfile
      args:
        JAVA_RUNTIME_IMAGE: ${JAVA_RUNTIME_IMAGE:-eclipse-temurin:21-jre-noble}
    environment:
      SERVER_PORT: "8080"
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: auto_care_demo
      DB_USERNAME: autocare_app
      DB_PASSWORD: ${DB_PASSWORD:?Provide DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Provide JWT_SECRET}
      SEED_PASSWORD_HASH: ${SEED_PASSWORD_HASH:?Provide SEED_PASSWORD_HASH}
      LOGGING_LEVEL_COM_AUTOCARE: INFO
      AUTOCARE_KNOWLEDGE_STORAGE: /data/knowledge
      AUTOCARE_VECTOR_REDIS_HOST: vector
      AUTOCARE_VECTOR_REDIS_PORT: "6379"
      AUTOCARE_BOOKING_AI_ENABLED: ${AUTOCARE_BOOKING_AI_ENABLED:-false}
      AUTOCARE_EMBEDDING_ENABLED: ${AUTOCARE_EMBEDDING_ENABLED:-false}
      AUTOCARE_QUOTE_AI_ENABLED: ${AUTOCARE_QUOTE_AI_ENABLED:-false}
      MODEL_BASE_URL: ${MODEL_BASE_URL:-https://api.deepseek.com}
      MODEL_NAME: ${MODEL_NAME:-deepseek-flash}
      MODEL_API_KEY: ${MODEL_API_KEY:-${DEEPSEEK_API_KEY:-}}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-18080}:8080"
    volumes:
      - knowledge-data:/data/knowledge
    healthcheck:
      test: ["CMD-SHELL", 'test "$$(curl --silent --max-time 3 --output /dev/null --write-out "%{http_code}" http://127.0.0.1:8080/api/v1/me)" = 401']
      interval: 5s
      timeout: 4s
      start_period: 25s
      retries: 15

volumes:
  mysql-data:
  vector-data:
  knowledge-data:
